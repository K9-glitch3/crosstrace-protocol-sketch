name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --editable ".[test]"
      - name: Run behaviour tests
        run: python -m pytest
      - name: Run the offline worked example
        run: python -m crosstrace_sketch.demo
      - name: Run and verify the credential-free scripted pilot
        run: |
          python -m crosstrace_sketch.pilot.runner --output-dir .pilot-ci-result
          python -m crosstrace_sketch.pilot.verify .pilot-ci-result
          python -m crosstrace_sketch.pilot.verify pilot/results/pilot-v0.1
      - name: Run and verify the six-cell development release
        run: |
          python -m preaward.crosstrace_sprint4.runner --output-dir .six-cell-ci-result
          python -m preaward.crosstrace_sprint4.verify .six-cell-ci-result
          python -m preaward.crosstrace_sprint4.verify preaward/results/six-cell-v0.1
